<div class="container-fluid">
    <div class="row">
        <div class="col-md-12">
            <ul class="list-group">
                <ng-content></ng-content>
                <li class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let item of products">
                 {{item.name}}
                  <span class="badge badge-primary badge-pill">{{item.price | currency: 'INR'}}</span>
                </li>
                <ng-content select="#visit"></ng-content>
              </ul>
        </div>
    </div>
</div>
