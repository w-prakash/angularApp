<table class="table">
    <thead class="primary">
      <tr>
        <th scope="col">#</th>
        <th scope="col">Name</th>
        <th scope="col">UserName</th>
        <th scope="col">website</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of users; index as i;" (click)="getUserDetails(item)">
        <th scope="row">{{i+1}}</th>
        <td>{{ item.name }}</td>
        <td>{{ item.username }}</td>
        <td>{{ item.website }}</td>
      </tr>
    </tbody>
  </table>
